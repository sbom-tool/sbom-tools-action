name: 'sbom-tools-action'
description: 'Install and run sbom-tools for SBOM diff, validation, quality scoring, enrichment, verification, and license checking'
author: 'sbom-tool'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'sbom-tools version: an exact 0.4.x release such as "0.4.0" (the default, updated with each release of this Action), or "latest" for the newest 0.4.x release. Versions outside 0.4.x are rejected; use sbom-tools-action@v1 for sbom-tools 0.3.x. Ignored when binary-path is set.'
    required: false
    default: '0.4.0'
  command:
    description: 'Command to run: diff, validate, quality, view, query, enrich, verify, license-check, vex'
    required: true
  args:
    description: 'Arguments for the command: SBOM paths, the vex or verify subcommand, and any other sbom-tools flags. Split on whitespace (spaces, tabs, line breaks) with no quoting, escaping or glob expansion. The flags set by the inputs below are added after them.'
    required: false
    default: ''
  fail-on-vuln:
    description: 'Exit 2 if the diff introduces vulnerabilities, or view finds any (--fail-on-vuln; diff, view)'
    required: false
    default: 'false'
  fail-on-change:
    description: 'Exit 1 if the diff finds any change (--fail-on-change; diff)'
    required: false
    default: 'false'
  fail-on-vex-gap:
    description: 'Exit 4 if introduced vulnerabilities lack VEX statements (--fail-on-vex-gap; diff)'
    required: false
    default: 'false'
  fail-on-warning:
    description: 'Exit 2 on compliance warnings, not only errors (--fail-on-warning; validate)'
    required: false
    default: 'false'
  require-applicable:
    description: 'Exit 1 when a selected standard does not apply to the SBOM, instead of reporting it as N/A (--require-applicable; validate)'
    required: false
    default: 'false'
  enrich-vulns:
    description: 'Enrich with OSV vulnerability data (--enrich-vulns; diff, view, quality, query, enrich, vex)'
    required: false
    default: 'false'
  output-format:
    description: 'Output format, passed as --output: summary, json, sarif, oscal-json, markdown, html, table, csv, ndjson, side-by-side or sbomqs-json. Each command accepts its own subset.'
    required: false
    default: ''
  output-file:
    description: 'Write the report to this file (--output-file), relative to working-directory and inside the workspace. Not accepted by license-check or verify.'
    required: false
    default: ''
  min-score:
    description: 'Exit 1 if the quality score is below this threshold, 0-100 (--min-score; quality)'
    required: false
    default: ''
  standard:
    description: 'Compliance standard(s), comma-separated (--standard; validate): ntia, fda, cra, cra-phase1, ssdf, eo14028, cnsa2, pqc, bsi, oss-steward, eucc, ai-act, bsi-ai, cisa-2026, pci-dss, fsct, or an alias. Passed through; sbom-tools validates it.'
    required: false
    default: ''
  profile:
    description: 'Quality scoring profile (--profile; quality): minimal, standard, security, license-compliance, cra, bsi, comprehensive, cbom, ai-readiness, or an alias. Passed through; sbom-tools validates it.'
    required: false
    default: ''
  sarif-category:
    description: 'Code-scanning category of -o sarif output, its runs[].automationDetails.id (--sarif-category; diff, view, validate, quality). upload-sarif ignores its own category input for this SARIF, so set the category here.'
    required: false
    default: ''
  sarif-base:
    description: 'Directory the SBOM path in -o sarif output is relative to (--sarif-base; diff, view, validate, quality). sbom-tools defaults to the git repository the SBOM is in.'
    required: false
    default: ''
  sarif-include-passes:
    description: 'With -o sarif, also report every check the SBOM passed, as results of kind "pass" (--sarif-include-passes; validate)'
    required: false
    default: 'false'
  sarif-max-results:
    description: 'Most results one -o sarif run keeps; sbom-tools defaults to 25000, the most GitHub code scanning accepts, and 0 keeps every result (--sarif-max-results; diff, view, validate, quality)'
    required: false
    default: ''
  as-of:
    description: 'Evaluate deadline-sensitive checks at this instant instead of now: RFC 3339 or YYYY-MM-DD (--as-of; validate, quality)'
    required: false
    default: ''
  cra-sidecar:
    description: 'CRA sidecar metadata file, JSON or YAML (--cra-sidecar; validate, quality, view), relative to working-directory and inside the workspace'
    required: false
    default: ''
  cra-product-class:
    description: 'CRA product class: default, important-class-1, important-class-2 or critical (--cra-product-class; validate, quality, view)'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run sbom-tools in, relative to the workspace'
    required: false
    default: '.'
  verify-provenance:
    description: 'Build provenance check of the downloaded release: "require" (default; fail if it cannot be verified), "warn" (warn and install on the SHA-256 checksum), "off" (skip). The SHA-256 checksum is always checked.'
    required: false
    default: 'require'
  binary-path:
    description: 'Path to an existing sbom-tools binary to run instead of downloading a release, such as one built from source; a relative path is taken from the workspace root. Skips the download, checksum and provenance checks; version and verify-provenance are ignored.'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'Exit code of sbom-tools, set even when the step fails: 0 success, 1 gate failed, 2 vulnerabilities or compliance warnings, 3 usage or operational error (also when the Action fails before sbom-tools runs), 4 VEX gaps, 5 license policy, 6 KEV, 7 ML regression'
    value: ${{ steps.run.outputs.exit-code || steps.setup.outputs.exit-code }}
  version:
    description: 'The sbom-tools version that ran'
    value: ${{ steps.setup.outputs.version }}
  slsa-verified:
    description: 'Whether the build provenance of the downloaded binary was verified (true/false)'
    value: ${{ steps.setup.outputs.slsa-verified }}
  output-file:
    description: 'Absolute path of the report written to output-file; empty when none was written'
    value: ${{ steps.run.outputs.output-file }}

runs:
  using: 'composite'
  steps:
    # SECURITY: no ${{ }} expression appears in a run: block. Every input
    # reaches the scripts through env:, and the scripts never evaluate it:
    # arguments are built as a bash array and passed to sbom-tools directly.
    - name: Set up sbom-tools
      id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
        INPUT_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        INPUT_FAIL_ON_VEX_GAP: ${{ inputs.fail-on-vex-gap }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_REQUIRE_APPLICABLE: ${{ inputs.require-applicable }}
        INPUT_ENRICH_VULNS: ${{ inputs.enrich-vulns }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_STANDARD: ${{ inputs.standard }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_SARIF_CATEGORY: ${{ inputs.sarif-category }}
        INPUT_SARIF_BASE: ${{ inputs.sarif-base }}
        INPUT_SARIF_INCLUDE_PASSES: ${{ inputs.sarif-include-passes }}
        INPUT_SARIF_MAX_RESULTS: ${{ inputs.sarif-max-results }}
        INPUT_AS_OF: ${{ inputs.as-of }}
        INPUT_CRA_SIDECAR: ${{ inputs.cra-sidecar }}
        INPUT_CRA_PRODUCT_CLASS: ${{ inputs.cra-product-class }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_VERIFY_PROVENANCE: ${{ inputs.verify-provenance }}
        INPUT_BINARY_PATH: ${{ inputs.binary-path }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/setup.sh"

    - name: Run sbom-tools
      id: run
      shell: bash
      env:
        SBOM_TOOLS_BIN: ${{ steps.setup.outputs.binary }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
        INPUT_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        INPUT_FAIL_ON_VEX_GAP: ${{ inputs.fail-on-vex-gap }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_REQUIRE_APPLICABLE: ${{ inputs.require-applicable }}
        INPUT_ENRICH_VULNS: ${{ inputs.enrich-vulns }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_STANDARD: ${{ inputs.standard }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_SARIF_CATEGORY: ${{ inputs.sarif-category }}
        INPUT_SARIF_BASE: ${{ inputs.sarif-base }}
        INPUT_SARIF_INCLUDE_PASSES: ${{ inputs.sarif-include-passes }}
        INPUT_SARIF_MAX_RESULTS: ${{ inputs.sarif-max-results }}
        INPUT_AS_OF: ${{ inputs.as-of }}
        INPUT_CRA_SIDECAR: ${{ inputs.cra-sidecar }}
        INPUT_CRA_PRODUCT_CLASS: ${{ inputs.cra-product-class }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
